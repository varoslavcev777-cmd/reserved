    .navbar {
      position: fixed;

      z-index: 50;

    .navbar.scrolled {

    }

    .navigate-button {
      position: absolute;
      left: 50%;
      top: 50%;

      color: rgba(255, 255, 255, 0.9);

      font-size: 14px;

      opacity: 0;

    }

    .navigate-button:hover {

    }

    .flower {
      position: relative;
      z-index: 60;

      transform: translateY(-16px);

    }

    .flower svg {
      width: 100%;
      height: 100%;

    .hamburger {
      display: none;

      position: relative;
      z-index: 60;

      width: 32px;
      height: 32px;

      border: 0;
      background: transparent;

      cursor: pointer;

      opacity: 0;

    }

    .hamburger-inner {
      position: absolute;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 6px;
    }

    }

      transform: translateY(4px) rotate(45deg);
    }

    .hamburger.open .hamburger-bar:last-child {
      transform: translateY(-4px) rotate(-45deg);
    }

  <script>
    (function () {

      const body = document.body;
      const navbar = document.getElementById("navbar");

      const navigateButton =
        document.getElementById("navigateButton");

      const navigateText =
        document.getElementById("navigateText");

      const hamburger =
        document.getElementById("hamburger");

      const menuOverlay =
        document.getElementById("menuOverlay");

      const menuLinks =
        document.querySelectorAll(".menu-link");

      const video =
        document.getElementById("heroVideo");

      /*
        IMPORTANT:
        We intentionally do NOT wait for window.load.

        The external video can take a long time to load.
        Waiting for window.load was the reason the page
        could remain completely black.
      */

      function mountPage() {
        body.classList.add("mounted");
      }

      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          function () {
            setTimeout(mountPage, 100);
          }
        );
      } else {
        setTimeout(mountPage, 100);
      }

      /* =====================================
         NAVBAR SCROLL
      ===================================== */

      function updateNavbar() {
        if (window.scrollY > 40) {
          navbar.classList.add("scrolled");
        } else {
          navbar.classList.remove("scrolled");
        }
      }

      window.addEventListener(
        "scroll",
        updateNavbar,
        { passive: true }
      );

      updateNavbar();

      /* =====================================
         MENU
      ===================================== */

      let menuOpen = false;

      function openMenu() {
        menuOpen = true;

        menuOverlay.classList.add("open");
        hamburger.classList.add("open");

        hamburger.setAttribute(
          "aria-expanded",
          "true"
        );

        hamburger.setAttribute(
          "aria-label",
          "Close navigation"
        );

        if (navigateText) {
          navigateText.textContent = "Close";
        }

        document.body.style.overflow = "hidden";
      }

      function closeMenu() {
        menuOpen = false;

        menuOverlay.classList.remove("open");
        hamburger.classList.remove("open");

        hamburger.setAttribute(
        255, 0.7);

      font-size: 16px;
      line-height: 1.5;
    }

    .hero-cta {
      display: inline-block;

      color: #000;

      font-size: 14px;
      font-weight: 500;

      transition:
        background-color 200ms ease,
        transform 200ms ease;
    }

    .hero-cta:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }

      }

        font-size: 18px;

      .hero-cta {

      }

      }
    }

    max-width: 767px {

      .flower {
        display: none;

        display: block;
      }

      }
    }

    min-width: 1024px {

        if (navigateText) {
          navigateText.textContent = "Navigate";
        }

        document.body.style.overflow = "";
      }

      function toggleMenu() {
        if (menuOpen) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      navigateButton.addEventListener(
        "click",
        toggleMenu
      );

      hamburger.addEventListener(
        "click",
        toggleMenu
      );

      menuLinks.forEach(function (link) {
        link.addEventListener(
          "click",
          function () {
            closeMenu();
          }
        );
      });

      document.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Escape" && menuOpen) {
            closeMenu();
          }
        }
      );

      /* =====================================
         VIDEO
      ===================================== */

      /*
        If autoplay is blocked, we still try to
        start the muted video manually.
      */

      function startVideo() {
        if (!video) return;

        video.muted = true;

        const playPromise = video.play();

        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {
          playPromise.catch(function () {
            /*
              Video playback can be blocked by the browser.
              This is harmless — the rest of the website
              remains fully functional.
            */
          });
        }
      }

      setTimeout(startVideo, 500);

    })();
