    .navigate-button:hover {

  <script>

    /* =================================
       ELEMENTS
    ================================= */

    const body = document.body;
    const navbar = document.getElementById("navbar");

    const overlay = document.getElementById("overlay");

    const navigateButton =
      document.getElementById("navigateButton");

    const navigateText =
      document.getElementById("navigateText");

    const hamburger =
      document.getElementById("hamburger");

    const overlayLinks =
      document.querySelectorAll(".overlay-link");

    /* =================================
       PAGE ENTRANCE
    ================================= */

    window.addEventListener("load", function () {

      setTimeout(function () {

        body.classList.add("mounted");

      }, 100);

    });

    /* =================================
       SCROLL NAVBAR
    ================================= */

    window.addEventListener("scroll", function () {

      if (window.scrollY > 40) {

        navbar.classList.add("scrolled");

      } else {

        navbar.classList.remove("scrolled");

      }

    });

    /* =================================
       MENU
    ================================= */

    function openMenu() {

      overlay.classList.add("open");

      hamburger.classList.add("open");

      navigateText.textContent = "Close";

      body.style.overflow = "hidden";

    }

    function closeMenu() {

      overlay.classList.remove("open");

      hamburger.classList.remove("open");

      navigateText.textContent = "Navigate";

      body.style.overflow = "";

    }

    function toggleMenu() {

      if (overlay.classList.contains("open")) {

        closeMenu();

      } else {

        openMenu();

      }

    }

    /* =================================
       BUTTONS
    ================================= */

    navigateButton.addEventListener(
      "click",
      toggleMenu
    );

    hamburger.addEventListener(
      "click",
      toggleMenu
    );

    /* =================================
       OVERLAY LINKS
    ================================= */

    overlayLinks.forEach(function (link) {

      link.addEventListener("click", function () {

        closeMenu();

      });

    });

    /* =================================

    .mounted .hamburger {
      opacity: 1;
      transform: translateY(0);

      transition-delay: 200ms;

      display: block;

    .hamburger.open span:first-child {
      transform: translateY(4px) rotate(45deg);
    }

    .hamburger.open span:last-child {
      transform: translateY(-4px) rotate(-45deg);
    }

    /* ==============================

    .overlay {

      justify-content: center;

      opacity: 0;

      transition:
        opacity 700ms cubic-bezier(0.76, 0, 0.24, 1),

    }

    .overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .overlay-nav {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 32px;

      text-align: center;

    .overlay-link {
      color: white;

    .mounted .video-wrapper {
